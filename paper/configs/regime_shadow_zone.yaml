name: regime_shadow_zone
notes: >
  Section 7.0.3. Ray theory predicts a shadow zone for a -30 m source in the
  downward-refracting Oregon profile: no direct water-borne path to a 100 m
  channel beyond ~1.4 km, or to a 1575 m channel beyond ~15.9 km (those
  round numbers come from the hand-typed oregon_nov profile quoted in the
  research question). At 20 Hz in a guide only 1.3-7 wavelengths deep, ray
  theory is marginal and a sharp shadow zone is exactly the kind of ray
  prediction normal modes overturn -- Task 10 built the mode solver to
  settle this.

  truth_model names hycom_south_deep, NOT oregon_nov: oregon_nov is
  hand-typed indicative numbers, never measured or reanalysis, and this
  experiment's conclusion must not rest on it (oregon_nov is used only in
  this module's unit tests, to check the table's mechanics against a fixed,
  known profile). hycom_south_deep covers 0-1500 m (98.4% of picks) and was
  itself never validated in-situ -- its credibility is inferred from
  hycom_oregon_nov's 0.47 m/s median agreement with in-situ CTD 87 km away
  at the shallower OOI site (see soundspeed/reanalysis.py). inversion_model
  is unused by shadow_zone_table (it takes a profile directly, not an
  ExperimentConfig) and is set to constant_c only to satisfy the loader's
  self-consistency guard, matching the convention in
  regime_depth_vs_path.yaml.

  Seabed geoacoustics are unknown at this site, so they are swept rather
  than fixed at one invented value, and the mode count is reported as
  [n_modes_min, n_modes_max] across the sweep -- the spread is the
  uncertainty. A nonzero n_modes_min falsifies ray theory's "no path
  exists" claim; it is NOT a claim that a detectable arrival reaches the
  receiver (soundspeed/modes.py computes existence, not attenuation,
  source excitation, or transmission loss -- see its module docstring).
truth_model: {kind: raytrace, profile: hycom_south_deep}
inversion_model: {kind: constant_c, c: 1480.0}
freq_hz: 20.0
seabed_sweep:
  - {c: 1550.0, rho: 1.5, alpha: 0.05}
  - {c: 1700.0, rho: 1.8, alpha: 0.15}
  - {c: 1900.0, rho: 2.1, alpha: 0.40}
geometries:
  - [30.0, 100.0, 5000.0]
  - [30.0, 150.0, 10000.0]
  - [30.0, 500.0, 20000.0]
  - [30.0, 1000.0, 30000.0]
  - [30.0, 1575.0, 40000.0]
